services:
  music-server:
    build: .
    container_name: music-server
    ports:
      - "5000:5000"
    volumes:
      - ./music:/music:ro
      - ./config.json:/app/config.json
      - ./playlists.json:/app/playlists.json
      - ./.secret.key:/app/.secret.key
    restart: unless-stopped
    healthcheck:
      test: python -c "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status == 200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  invidious-db:
    image: docker.io/library/postgres:14
    container_name: invidious-db
    restart: unless-stopped
    volumes:
      - invidious-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5

  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: invidious
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      invidious-db:
        condition: service_healthy
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        registration_enabled: true
        captcha_enabled: false
        login_enabled: true
        hmac_key: "4b6a5afbdde5089a07854c01f8e5e296"
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "nHDoMbdZekWabBaw"
        domain: "localhost"
        external_port: 3000
        https_only: false
        statistics_enabled: false
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2

  companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: invidious-companion
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=nHDoMbdZekWabBaw
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companion-cache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

volumes:
  invidious-postgres:
  companion-cache:
